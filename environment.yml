# Minimal environment to run mask generation with the released weights.
#
# Create it with:
#   conda env create -f environment.yml
#   conda activate basis
#
# GPU support: this installs the CPU build of TensorFlow via pip. For GPU
# inference, follow https://www.tensorflow.org/install/pip for the extra
# CUDA/cuDNN setup matching your driver, then `pip install tensorflow` (or
# `tensorflow[and-cuda]` on Linux) inside this environment.
name: basis
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - rasterio>=1.3
  - "numpy>=1.23,<2.0"
  - pip:
      - "tensorflow>=2.11,<2.16"
